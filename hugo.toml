baseURL = "https://richmondpilots.org/"
locale = "en-US"
title = "Richmond Pilots"
disableKinds = ["taxonomy", "term", "rss"]
enableGitInfo = true
enableRobotsTXT = false

[markup.goldmark.renderer]
