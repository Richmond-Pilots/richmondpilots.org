name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for GitHub OIDC -> AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for accurate page dates in the sitemap

      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          rm hugo.deb

      - name: Build site
        run: hugo

      # The sync below deletes anything not in public/, so stop on a bad build
      # or on placeholders that were never filled in.
      - name: Check build output
        run: |
          test -s public/index.html
          if grep -rl --include='*.html' 'data-placeholder' public; then
            echo "::error::These pages still contain placeholders. Fill them in before deploying."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # previews/* holds PR branch previews (see preview.yml); exclude it so
      # --delete doesn't wipe them on every production deploy.
      - name: Sync site to S3 (deletes files no longer in the build)
        run: |
          aws s3 sync public "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --exclude "previews/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
