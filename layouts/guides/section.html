{{ define "main" }}
<section class="section"><div class="wrap">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.lede }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="grid">
    {{ range .RegularPages }}
    <article class="card">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      {{ with .Params.lede }}<p>{{ . }}</p>{{ end }}
    </article>
    {{ end }}
  </div>
</div></section>
{{ end }}
